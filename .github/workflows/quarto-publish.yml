name: Build and Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # HTML 只输出到 _site，供 GitHub Pages 使用。
      - name: Render HTML
        run: quarto render --to html --output-dir _site

      # Quarto Book 的 LaTeX 源码输出到 tex/generated/。
      # 当前 Quarto 通常会在其中建立 book-latex/ 子目录；
      # main.tex 同时兼容直接输出到 generated/ 根目录的情况。
      - name: Render LaTeX body
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tex/generated
          quarto render --to latex --output-dir tex/generated

          if [[ -f tex/generated/book-latex/PT-Notes.tex ]]; then
            echo 'LaTeX body: tex/generated/book-latex/PT-Notes.tex'
          elif [[ -f tex/generated/PT-Notes.tex ]]; then
            echo 'LaTeX body: tex/generated/PT-Notes.tex'
          else
            echo 'PT-Notes.tex was not generated.' >&2
            find tex/generated -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

      # Artifact 中保留顶层 tex/ 目录。
      - name: Prepare TeX source artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/PT-Notes-tex-source
          mkdir -p dist/PT-Notes-tex-source
          cp -a tex dist/PT-Notes-tex-source/

          # 不把预览/编译缓存带入源码包。
          find dist/PT-Notes-tex-source -type d \
            \( -name aux -o -name latex-preview-cache \) \
            -prune -exec rm -rf {} + || true
          find dist/PT-Notes-tex-source -type f \
            \( -name '*.aux' -o -name '*.log' -o -name '*.toc' \
               -o -name '*.out' -o -name '*.fls' -o -name '*.fdb_latexmk' \
               -o -name '*.synctex.gz' -o -name '*.xdv' -o -name 'main.pdf' \) \
            -delete

          echo '===== TeX artifact ====='
          find dist/PT-Notes-tex-source -maxdepth 5 -type f | sort

      - name: Upload TeX source artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT-Notes-tex-source
          path: dist/PT-Notes-tex-source
          retention-days: 30
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
