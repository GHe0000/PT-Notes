name: Build and Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Setup Quarto              # 原配置：未安装 LaTeX，latex 格式渲染会失败
      #   uses: quarto-dev/quarto-actions/setup@v2
      - name: Setup Quarto and TinyTeX    # 新配置：同时安装 TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # - name: Install ctex for Chinese PDF  # 原配置：quarto-actions/setup 安装的 TinyTeX 不在 PATH 上，直接调用 tlmgr 会失败
      #   run: |
      #     tlmgr install ctex fandol
      #   shell: bash
      # 说明：quarto render 编译 PDF 时会自动检测并安装缺失的宏包（latex-auto-install 默认开启），
      # 因此无需手动执行 tlmgr，上面的步骤已注释。

      - name: Render Quarto
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload TeX files
        uses: actions/upload-artifact@v4
        with:
          name: tex-files
          path: _site/**/*.tex
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
